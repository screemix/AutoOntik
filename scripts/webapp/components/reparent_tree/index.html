<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; font-family: -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px; box-sizing: border-box;
  }
  #tree-wrap { position: relative; }
  #tree { width: 100%; }
  #action-controls {
    position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; gap: 4px;
  }
  #action-controls button {
    border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer;
    font-size: 12px; padding: 4px 10px;
  }
  #action-controls button:hover:not(:disabled) { background: #f0f0f0; }
  #action-controls button:disabled { opacity: 0.4; cursor: default; }
  .link { fill: none; stroke: #b0b0b0; stroke-width: 1.5px; }
  .node circle { stroke-width: 2px; cursor: grab; }
  .node circle.dragging { cursor: grabbing; opacity: 0.6; }
  .node circle.drop-target { stroke: #2e7d32; stroke-width: 4px; }
  .node circle.drop-invalid { stroke: #c62828; stroke-width: 4px; }
  .node text { font-size: 11px; fill: #222; pointer-events: none; }
  .node.root circle { fill: #4C72B0; stroke: #2f4d78; }
  .node.internal circle { fill: #DD8452; stroke: #a4602f; }
  .node.leaf circle { fill: #55A868; stroke: #327142; }
  .node.highlight circle { stroke: #f9a825; stroke-width: 4px; }
  .node.synthetic-root circle { fill: #cccccc; r: 3; }
  .node circle.selected-source { stroke: #1565c0; stroke-width: 4px; stroke-dasharray: 3,2; }
  .node circle.has-hidden-children { stroke-dasharray: 2,2; }
  .toggle { cursor: pointer; }
  .toggle rect { fill: #fff; stroke: #888; stroke-width: 1px; }
  .toggle text { font-size: 10px; fill: #444; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .toggle:hover rect { fill: #eee; }
  #hint { font-size: 12px; color: #666; }
  #hint.pending { color: #1565c0; font-weight: 600; }
  #zoom-controls { display: flex; gap: 4px; }
  #zoom-controls button {
    width: 24px; height: 24px; border: 1px solid #ccc; border-radius: 4px; background: #fff;
    cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
  }
  #zoom-controls button:hover { background: #f0f0f0; }
</style>
</head>
<body>
<div id="topbar">
  <div id="hint">Drag a node onto a new parent, or click a node then click its new parent (works across pans/zooms). Scroll/pinch or use the buttons to zoom.</div>
  <div id="zoom-controls">
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="zoom-reset" title="Reset zoom">⟲</button>
    <button id="zoom-in" title="Zoom in">+</button>
  </div>
</div>
<div id="tree-wrap">
  <div id="action-controls">
    <button id="undo-btn" title="Undo last move">Undo</button>
    <button id="reset-btn" title="Reset to original">Reset</button>
    <button id="delete-btn" title="Select a node first (click it), then click here to delete it and its subtree" disabled>Delete subtree</button>
  </div>
  <div id="tree"></div>
</div>
<script src="./vendor/d3.min.js"></script>
<script>
// ── Streamlit component wire protocol (hand-written; see __init__.py docstring) ──
const SYNTHETIC_ROOT = "__forest_root__";
let currentArgs = null;
let currentZoomBehavior = null;   // re-assigned on every render() call
let currentSvg = null;
// Collapsed node ids, persisted ACROSS render() calls (module-level, not
// re-declared inside render()) so exploring one branch survives an edit
// elsewhere in the tree triggering a fresh Streamlit render.
const collapsedIds = new Set();
let collapseInitialized = false;   // true after the one-time auto-collapse-on-first-load below

document.getElementById("zoom-in").addEventListener("click", () => {
  if (currentSvg && currentZoomBehavior) currentSvg.transition().duration(200).call(currentZoomBehavior.scaleBy, 1.3);
});
document.getElementById("zoom-out").addEventListener("click", () => {
  if (currentSvg && currentZoomBehavior) currentSvg.transition().duration(200).call(currentZoomBehavior.scaleBy, 1 / 1.3);
});
document.getElementById("zoom-reset").addEventListener("click", () => {
  if (currentSvg && currentZoomBehavior) currentSvg.transition().duration(200).call(currentZoomBehavior.transform, d3.zoomIdentity);
});

function sendToStreamlit(type, payload) {
  window.parent.postMessage(Object.assign({ type, isStreamlitMessage: true }, payload), "*");
}
function setFrameHeight(h) { sendToStreamlit("streamlit:setFrameHeight", { height: h }); }
function setComponentValue(value) { sendToStreamlit("streamlit:setComponentValue", { value, dataType: "json" }); }

function showError(err) {
  const el = document.getElementById("tree");
  if (el) el.innerText = "Reparent tree failed to render: " + err;
  setFrameHeight(80);
}
// Nothing above this point is allowed to fail silently: an uncaught
// exception inside a postMessage handler is swallowed by the browser with
// no visible trace on the page, which is exactly what made an earlier bug
// here (missing d3.stratify() parent) look like "nothing renders" instead
// of a legible error.
window.onerror = (msg, src, line, col, err) => { showError(err || msg); return false; };

let gotFirstRender = false;
window.addEventListener("message", (event) => {
  const data = event.data;
  // NOTE: unlike component -> host messages (componentReady, setComponentValue,
  // setFrameHeight), which Streamlit's ComponentRegistry validates via an
  // isStreamlitMessage property, the host -> component "streamlit:render"
  // message does NOT carry that property (confirmed against Streamlit
  // 1.40.1's own sendRenderMessage(), which posts only
  // {type, args, dfs, disabled, theme}). Gating on it here silently dropped
  // every render message. Match on `type` alone for incoming messages.
  if (!data || typeof data !== "object") return;
  if (data.type === "streamlit:render") {
    gotFirstRender = true;
    currentArgs = data.args;
    try {
      render(currentArgs);
    } catch (err) {
      showError(err);
    }
  }
});
if (typeof d3 === "undefined") {
  showError("d3.min.js did not load (check the component's vendor/ path).");
} else {
  // Streamlit's protocol explicitly allows redundant componentReady messages
  // ("not an error to get multiple... we always respond with the most
  // recent render arguments" -- componentUtils.tsx), so retry defensively
  // in case the very first one ever raced the host's listener registration
  // -- cheap, and it stops itself the moment a render actually lands.
  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  const retry = setInterval(() => {
    if (gotFirstRender) { clearInterval(retry); return; }
    sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  }, 200);
  setTimeout(() => clearInterval(retry), 5000);
}

// ── Cycle check mirrored client-side (UX only -- server re-validates authoritatively) ──
function wouldCreateCycle(childId, newParentId, parentOf) {
  let cur = newParentId;
  const seen = new Set();
  while (cur !== undefined && cur !== null) {
    if (cur === childId) return true;
    if (seen.has(cur)) break;
    seen.add(cur);
    cur = parentOf[cur];
  }
  return false;
}

function render(args) {
  const nodesIn = args.nodes || [];
  const edgesIn = args.edges || [];
  const highlight = new Set(args.highlight_ids || []);
  const topbarHeight = document.getElementById("topbar").offsetHeight;
  const height = (args.height || 600) - topbarHeight;

  const undoBtn = document.getElementById("undo-btn");
  const resetBtn = document.getElementById("reset-btn");
  const deleteBtn = document.getElementById("delete-btn");
  undoBtn.disabled = !args.can_undo;
  resetBtn.disabled = !args.can_undo;
  deleteBtn.disabled = true;   // re-enabled once a node is click-selected, below
  undoBtn.onclick = () => setComponentValue({ action: "undo" });
  resetBtn.onclick = () => setComponentValue({ action: "reset" });
  deleteBtn.onclick = () => {
    if (!pendingMoveSource) return;
    setComponentValue({ action: "delete", node: pendingMoveSource.id });
    clearPendingSelection();
  };

  // Capture the CURRENT pan/zoom before the old SVG is torn down below, so
  // a toggle click (or any other client-side re-render) doesn't snap the
  // view back to fully-zoomed-out -- restored onto the new SVG once it's
  // built. null on the very first render (nothing to preserve yet).
  const savedTransform = currentSvg ? d3.zoomTransform(currentSvg.node()) : null;

  document.getElementById("tree").innerHTML = "";
  const parentOf = {};
  edgesIn.forEach(e => { parentOf[e.child] = e.parent; });

  // Full (unfiltered) children map, independent of collapse state -- used
  // to know whether a node has anything to collapse/expand at all (the
  // toggle), and to compute which ids are actually visible below.
  const fullChildrenOf = {};
  nodesIn.forEach(n => {
    const p = parentOf[n.id];
    if (p !== undefined) (fullChildrenOf[p] = fullChildrenOf[p] || []).push(n.id);
  });
  // Drop collapsedIds entries for nodes that no longer exist (e.g. deleted
  // in a previous edit) -- otherwise they'd just sit there harmlessly, but
  // there's no reason to let stale ids accumulate across a long session.
  const allIds = new Set(nodesIn.map(n => n.id));
  Array.from(collapsedIds).forEach(id => { if (!allIds.has(id)) collapsedIds.delete(id); });

  // Start compact: collapse everything below the top level ONCE, the very
  // first time this iframe ever renders, so the initial view is just roots
  // -- expand on demand from there via the +/- toggle below. Only runs
  // once (module-level flag): later renders (a reparent elsewhere, a
  // toggle click) must never re-collapse whatever the viewer has already
  // expanded.
  if (!collapseInitialized) {
    collapseInitialized = true;
    Object.keys(fullChildrenOf).forEach(id => collapsedIds.add(id));
  }

  const visibleIds = new Set();
  function collectVisible(id) {
    visibleIds.add(id);
    if (collapsedIds.has(id)) return;   // don't descend into a collapsed node's children
    (fullChildrenOf[id] || []).forEach(collectVisible);
  }
  nodesIn.forEach(n => {
    if (parentOf[n.id] === undefined || !allIds.has(parentOf[n.id])) collectVisible(n.id);
  });

  const stratifyRows = nodesIn.filter(n => visibleIds.has(n.id)).map(n => ({
    id: n.id, parentId: parentOf[n.id] !== undefined ? parentOf[n.id] : SYNTHETIC_ROOT, label: n.label,
  }));
  stratifyRows.push({ id: SYNTHETIC_ROOT, parentId: null, label: "" });

  let root;
  try {
    root = d3.stratify().id(d => d.id).parentId(d => d.parentId)(stratifyRows);
  } catch (err) {
    showError(err);
    return;
  }

  // Horizontal (left-to-right) layout: d3.tree() always computes
  // d.x = breadth position, d.y = depth position internally, regardless of
  // visual orientation -- transform maps (d.y, d.x) to (horizontal,
  // vertical) here, so depth grows rightward and siblings stack vertically.
  // Preferred over top-down for this corpus once zoom/pan was added --
  // reads more naturally for browsing a wide, shallow forest.
  const dx = 26, dy = 180;   // sibling spacing (vertical), depth spacing (horizontal)
  const treeLayout = d3.tree().nodeSize([dx, dy]);
  treeLayout(root);

  let x0 = Infinity, x1 = -Infinity;
  root.each(d => { if (d.x < x0) x0 = d.x; if (d.x > x1) x1 = d.x; });
  const breadthSpan = x1 - x0 + dx * 2;
  const depthSpan = (root.height + 1) * dy + dy;

  // The SVG's own box stays a FIXED, reasonable size -- with zoom/pan in
  // place, the viewBox can hold the tree's full virtual extent (thousands
  // of px for a large forest) without the iframe itself needing to be that
  // tall; at zoom=1 (identity transform) the whole tree is shrunk to fit
  // this fixed viewport, same as the old "fit everything" default, and the
  // viewer zooms in from there. Sizing the iframe to the full extent
  // instead (as an earlier version did) reserved thousands of px of blank
  // page height for content that was mostly scrolled out of view anyway.
  const svg = d3.select("#tree").append("svg")
    .style("width", "100%")
    .style("height", height + "px")
    .style("display", "block")
    .attr("viewBox", [-dy / 2, x0 - dx, depthSpan, breadthSpan]);

  const g = svg.append("g");

  // Pan/zoom: 343 nodes across 28 roots can't be legible at a fixed
  // fit-to-width scale, so let the viewer zoom in on a region instead.
  // .filter() excludes anything starting on a .node so panning never
  // fights the node-drag-to-reparent behavior below.
  const zoom = d3.zoom()
    .scaleExtent([0.2, 8])
    .filter((event) => !event.target.closest(".node"))
    .on("zoom", (event) => { g.attr("transform", event.transform); });
  svg.call(zoom);
  if (savedTransform) svg.call(zoom.transform, savedTransform);   // restore pre-rebuild pan/zoom, instantly
  currentZoomBehavior = zoom;
  currentSvg = svg;

  g.selectAll(".link")
    .data(root.links().filter(l => l.source.id !== SYNTHETIC_ROOT))
    .join("path")
    .attr("class", "link")
    .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

  const hasRealChildren = id => (fullChildrenOf[id] || []).length > 0;

  const nodeSel = g.selectAll(".node")
    .data(root.descendants().filter(d => d.id !== SYNTHETIC_ROOT))
    .join("g")
    .attr("class", d => "node " + (hasRealChildren(d.id) ? (d.depth === 0 ? "root" : "internal") : "leaf")
                       + (highlight.has(d.id) ? " highlight" : ""))
    .attr("transform", d => `translate(${d.y},${d.x})`);

  nodeSel.append("circle").attr("r", 6)
    .classed("has-hidden-children", d => hasRealChildren(d.id) && collapsedIds.has(d.id));
  nodeSel.append("text")
    .attr("dy", "0.32em")
    .attr("x", d => (hasRealChildren(d.id) ? -9 : 9))
    .attr("text-anchor", d => (hasRealChildren(d.id) ? "end" : "start"))
    .text(d => d.data.label + (collapsedIds.has(d.id) && hasRealChildren(d.id)
      ? ` (+${countDescendants(d.id)})` : ""));

  function countDescendants(id) {
    let count = 0;
    (function walk(nid) {
      (fullChildrenOf[nid] || []).forEach(cid => { count += 1; walk(cid); });
    })(id);
    return count;
  }

  // Collapse/expand toggle: a small +/- box offset toward where children
  // extend (rightward, in this horizontal layout), separate from the
  // node's own circle since that's already click-to-select/drag for
  // reparenting -- this must never compete with that gesture.
  const toggleSel = nodeSel.filter(d => hasRealChildren(d.id))
    .append("g")
    .attr("class", "toggle")
    .attr("transform", "translate(16,0)")
    .on("click", function (event, d) {
      event.stopPropagation();
      if (collapsedIds.has(d.id)) collapsedIds.delete(d.id); else collapsedIds.add(d.id);
      render(currentArgs);
    });
  toggleSel.append("rect").attr("x", -6).attr("y", -6).attr("width", 12).attr("height", 12);
  toggleSel.append("text").text(d => (collapsedIds.has(d.id) ? "+" : "−"));

  // ── Click-to-select-then-click-target (works across pans/zooms, unlike a
  // drag gesture which needs source and target both reachable within one
  // continuous mouse movement -- awkward or impossible once the tree is
  // wider than the screen) ──
  let pendingMoveSource = null;
  const hintEl = document.getElementById("hint");
  const baseHintText = hintEl.textContent;

  function clearPendingSelection() {
    pendingMoveSource = null;
    nodeSel.select("circle").classed("selected-source", false);
    hintEl.textContent = baseHintText;
    hintEl.classList.remove("pending");
    deleteBtn.disabled = true;
  }

  function handleNodeClick(event, d) {
    event.stopPropagation();
    if (!pendingMoveSource) {
      pendingMoveSource = d;
      d3.select(this).classed("selected-source", true);
      hintEl.textContent = `Selected "${d.data.label}" -- click its new parent to reparent, or use "Delete subtree" to remove it (click it again to cancel).`;
      hintEl.classList.add("pending");
      deleteBtn.disabled = false;
      return;
    }
    if (pendingMoveSource.id === d.id) {
      clearPendingSelection();
      return;
    }
    if (!wouldCreateCycle(pendingMoveSource.id, d.id, parentOf)) {
      setComponentValue({ moved: pendingMoveSource.id, new_parent: d.id });
    } else {
      hintEl.textContent = "Would create a cycle -- pick a different parent, or click the selected node again to cancel.";
    }
    clearPendingSelection();
  }
  svg.on("click", () => clearPendingSelection());
  nodeSel.select("circle").on("click", handleNodeClick);

  // ── Drag behavior (convenient when source and target are both already
  // visible; use click-to-select above for anything further apart) ──
  let dragLine = null;
  let dropTarget = null;

  const drag = d3.drag()
    .clickDistance(5)   // tolerate a few px of jitter on an intended click without treating it as a drag
    .on("start", function (event, d) {
      d3.select(this).select("circle").classed("dragging", true);
      dragLine = g.append("line")
        .attr("stroke", "#999").attr("stroke-dasharray", "4,3")
        .attr("x1", d.y).attr("y1", d.x).attr("x2", d.y).attr("y2", d.x);
    })
    .on("drag", function (event, d) {
      dragLine.attr("x2", event.x).attr("y2", event.y);
      nodeSel.select("circle").classed("drop-target", false).classed("drop-invalid", false);
      dropTarget = null;
      nodeSel.each(function (o) {
        if (o.id === d.id) return;
        const dx2 = o.y - event.x, dy2 = o.x - event.y;
        if (Math.sqrt(dx2 * dx2 + dy2 * dy2) < 10) {
          dropTarget = o;
          const invalid = wouldCreateCycle(d.id, o.id, parentOf);
          d3.select(this).select("circle").classed(invalid ? "drop-invalid" : "drop-target", true);
        }
      });
    })
    .on("end", function (event, d) {
      d3.select(this).select("circle").classed("dragging", false);
      if (dragLine) { dragLine.remove(); dragLine = null; }
      nodeSel.select("circle").classed("drop-target", false).classed("drop-invalid", false);
      if (dropTarget && dropTarget.id !== d.id && !wouldCreateCycle(d.id, dropTarget.id, parentOf)) {
        setComponentValue({ moved: d.id, new_parent: dropTarget.id });
      }
      dropTarget = null;
    });

  nodeSel.select("circle").call(drag);

  setFrameHeight(height + topbarHeight);
}
</script>
</body>
</html>
