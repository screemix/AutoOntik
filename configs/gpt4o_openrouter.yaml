# configs/gpt4o_openrouter.yaml
#
# Same hyperparameters as configs/gpt_oss.yaml, with the LLM client swapped
# to gpt-4o via OpenRouter (+ PROXY_URL) instead of gpt-oss-120b via AIRI --
# used to isolate backbone model as the only variable in the MINE
# AutoOntic-vs-KGGen extraction-density comparison (see chat: does gpt-4o's
# extraction density on this exact prompt/corpus differ from gpt-oss-120b's,
# and does that change the MINE accuracy gap against KGGen).

corpus_id: "mine_benchmark_gpt4o"
input_path: "./data/mine/triplets_gpt4o_rerun.jsonl"   # JSONL file, one raw triplet dict per line
output_dir: "./output/mine"

# ── LLM client ────────────────────────────────────────────────────────────────
llm:
  model: "openai/gpt-4o"
  api_key_env: "OPENROUTER_KEY"
  base_url: "https://openrouter.ai/api/v1"
  proxy_key_env: "PROXY_URL"

# ── Embedding client ──────────────────────────────────────────────────────────
embedding:
  contriever_model: "facebook/contriever"
  device: null                        # "cuda" | "cpu" | null (auto)
  embed_batch_size: 64

# ── Relation Canonicalization ─────────────────────────────────────────────────
relation_canonicalization:
  similarity_threshold: 0.75
  max_merge_rounds: 20
  max_parallel_workers: 8      # thread pool size for concurrent LLM cluster verification
  max_cluster_size: 40         # clusters over this size are split into sub-batches + stitched back
                                # together, instead of one oversized (slow, truncation-prone) LLM call

# ── Type Canonicalization ─────────────────────────────────────────────────────
type_canonicalization:
  hac_threshold: 0.75          # HDBSCAN cluster_selection_epsilon = 1 - this (name kept for compatibility)
  relation_context_top_k: 5
  max_merge_rounds: 20         # same convergence loop as relation_canonicalization above
  max_parallel_workers: 8
  max_cluster_size: 40

# ── Hierarchy Induction (current decomposed parent_check/child_check design) ──
hierarchy:
  relation_signature_weighting: "ppmi"
  weeds_containment_threshold: 0.75
  priority_band_tolerance: 10  # nodes within this many in-degree units of a band's top score share it
  seed_roots: []              # e.g. ["Endurant", "Perdurant", "Quality", "Abstract"] for a DOLCE-seeded run
  candidate_batch_size: 30      # cap on a level's size AND the trigger threshold for regrouping it
  max_regroup_input: 90
  max_regroup_rounds: 3
  label_collision_threshold: 0.90
  max_child_claim_share: 0.6
  max_depth: null              # null (YAML) / None (Python) means uncapped -- see hierarchy_induction.HierarchyConfig
  embed_batch_size: 64
  context_max_examples: 10     # real corpus entity examples shown per type
  context_max_subclasses: 5    # already-placed subclasses shown per type
  max_parallel_workers: 8      # thread pool size for band 2+ (band 1 always runs sequentially)

# ── Entity Deduplication + Class Assignment ───────────────────────────────────
# Candidates are partitioned by shared immediate parent in the TypeHierarchy
# first, then clustered with HDBSCAN within each partition.
entity_canonicalization:
  similarity_threshold: 0.85
  max_merge_rounds: 5
  max_parallel_workers: 8      # thread pool size for concurrent LLM cluster verification
  max_cluster_size: 40

# ── Domain/Range Constraint Induction ─────────────────────────────────────────
# Confidence (PCA-style) thresholds applied once, at the very end, to the
# direction-corrected, hierarchy-generalized (domain, range) pairs.
constraints:
  hard_threshold: 0.90
  soft_threshold: 0.50
  hint_threshold: 0.20
