# configs/llama.yaml
#
# Config for src/ontodisco/pipeline.py -- covers all five orchestrated steps:
# Relation Canonicalization, Type Canonicalization, Hierarchy Induction,
# Entity Deduplication, Constraint Induction. Extraction / Serialization are
# not implemented yet and have no config section here.

corpus_id: "my_corpus"
input_path: "./data/musique_initial_triplets.jsonl"   # JSONL file, one raw triplet dict per line
output_dir: "./output"

# ── LLM client ────────────────────────────────────────────────────────────────
llm:
  model: "Meta-llama/Llama-3.3-70B-Instruct"
  api_key_env: "AIRI_KEY"       # name of the env var holding the key -- never put the key itself here
  base_url: "https://inference.airi.net:46783/v1"

# ── Embedding client ──────────────────────────────────────────────────────────
embedding:
  contriever_model: "facebook/contriever"
  device: null                        # "cuda" | "cpu" | null (auto)
  embed_batch_size: 64

# ── Relation Canonicalization ─────────────────────────────────────────────────
relation_canonicalization:
  similarity_threshold: 0.75

# ── Type Canonicalization ─────────────────────────────────────────────────────
type_canonicalization:
  hac_threshold: 0.75
  relation_context_top_k: 5

# ── Hierarchy Induction ───────────────────────────────────────────────────────
hierarchy:
  relation_signature_weighting: "ppmi"
  weeds_containment_threshold: 0.75
  priority_band_tolerance: 10
  seed_roots: []
  candidate_batch_size: 50
  max_escalation_batches: 5
  max_depth: 15                # null (YAML) / None (Python) means uncapped -- see hierarchy_induction.HierarchyConfig
  embed_batch_size: 64
  context_top_k: 5
  max_parallel_workers: 8

# ── Entity Deduplication + Class Assignment ───────────────────────────────────
entity_canonicalization:
  similarity_threshold: 0.85
  max_merge_rounds: 5

# ── Domain/Range Constraint Induction ─────────────────────────────────────────
# Confidence (PCA-style) thresholds applied once, at the very end, to the
# direction-corrected, hierarchy-generalized (domain, range) pairs.
constraints:
  hard_threshold: 0.90
  soft_threshold: 0.50
  hint_threshold: 0.20
