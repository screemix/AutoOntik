# configs/mine_gpt41.yaml
#
# MINE benchmark, gpt-4.1 via OpenRouter -- same tuned settings as
# configs/mine_gptoss.yaml, differing ONLY in the LLM used for extraction
# and all subsequent ontology/KG-construction LLM calls. Motivated by a
# traced failure-mode investigation (essay 85, "The History of Human Space
# Travel"): gpt-oss-120b's Step-0 extraction silently dropped one conjunct
# of a shared-predicate list ("private companies such as SpaceX and Blue
# Origin" -> only Blue Origin got the "private company" typing) and an
# entire participial-clause fact ("revolutionized space travel by providing
# a reusable spacecraft"). A side-by-side single-essay extraction with
# gpt-4.1 fixed the first gap (caught both SpaceX AND Blue Origin, plus two
# disaster facts gpt-oss missed entirely) but NOT the second (still missed
# "reusable spacecraft") -- so this run tests how much of the recall gap is
# model capability vs. extraction-prompt phrasing, corpus-wide.

corpus_id: "mine_gpt41"
input_path: "./data/mine/triplets_gpt41.jsonl"
output_dir: "./output/mine"
language: "en"
include_qualifiers: true

llm:
  model: "openai/gpt-4.1"
  api_key_env: "OPENROUTER_KEY"
  base_url: "https://openrouter.ai/api/v1"

embedding:
  contriever_model: "facebook/contriever"
  device: null
  embed_batch_size: 64

relation_canonicalization:
  similarity_threshold: 0.75
  max_merge_rounds: 5
  max_parallel_workers: 8
  max_cluster_size: 40

type_canonicalization:
  hac_threshold: 0.75
  relation_context_top_k: 5
  max_merge_rounds: 5
  max_parallel_workers: 8
  max_cluster_size: 40

hierarchy:
  relation_signature_weighting: "ppmi"
  weeds_containment_threshold: 0.75
  priority_band_tolerance: 10
  seed_roots: []
  candidate_batch_size: 50      # cap on a level's size AND the trigger threshold for regrouping it
  max_regroup_input: 90
  max_regroup_rounds: 3
  label_collision_threshold: 0.90
  max_child_claim_share: 0.6
  max_depth: 50
  embed_batch_size: 64
  context_max_examples: 10      # real corpus entity examples shown per type
  context_max_subclasses: 5     # already-placed subclasses shown per type
  max_parallel_workers: 8

entity_canonicalization:
  similarity_threshold: 0.85
  max_merge_rounds: 5
  max_parallel_workers: 8
  max_cluster_size: 40

constraints:
  hard_threshold: 0.90
  soft_threshold: 0.50
  hint_threshold: 0.20
  min_support_for_hard: 3
