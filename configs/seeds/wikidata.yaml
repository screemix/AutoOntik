# configs/seeds/wikidata.yaml
#
# Wikidata-derived seed hierarchy, for use as an external
# `hierarchy.seed_roots_path` in a pipeline config -- see e.g.
# configs/gpt_oss_dolce_seeded.yaml for the DOLCE equivalent. Loaded by
# pipeline.load_seed_roots() into hierarchy_induction.HierarchyConfig.seed_roots
# at run time.
#
# Provenance (CLAUDE.md §15.3 / §15.5): roots are the 9 direct P279 children
# of Wikidata's `entity` (Q35120) marked "accept": true by hand in
# output/seed_roots/wikidata_tree.json's `root_candidates` (produced by
# scripts/seed_roots/wikidata_roots.py). Each root's own children were then
# fetched independently -- not via the shared-budget collect_seed_tree() BFS,
# which only ever reaches a couple of these before running out of budget, but
# via scripts/seed_roots/expand_accepted_roots.py, one dedicated query per
# accepted root -- keeping up to the top 10 of each root's own direct P279
# subclasses, ranked by subclass count.
#
# `description:` on each entry is Wikidata's own item description (verbatim,
# where one exists -- a handful of entries have none and the key is omitted
# rather than left empty). It flows into hierarchy_induction._apply_seed_roots
# -> _Node.definition, but ONLY for a label that gets freshly SYNTHESIZED (no
# match in this corpus's own type vocabulary T*) -- if a seed label happens to
# match an existing T* type, that type's own (currently always empty)
# definition is left alone rather than overwritten by a Wikidata gloss that
# may not reflect this corpus's actual usage of the term. From there it feeds
# BOTH embed_text() (embedding/similarity ranking) AND _node_context() (the
# "(context: ...)" shown to the LLM per candidate during placement) -- the
# latter matters most here, since a freshly-synthesized node otherwise
# reaches the LLM as a bare label with zero context (no relation evidence
# exists yet for a node nothing has attached under).
#
# Two fixups applied by hand versus the raw query result:
#   - Q7401 ("part", a musical-composition section) sits as a CHILD of the
#     root "part" (Q13196193, "separate element of a larger entity") -- same
#     bare label at two tree positions would otherwise silently collapse into
#     ONE node under _apply_seed_roots's normalized-label matching, producing
#     a self-referential seed edge. Relabeled "part (musical composition)".
#   - One child of "location" (Q2330585) has no English label on Wikidata
#     (the label service falls back to its own QID) and was dropped as
#     unusable.
#
# Caveat carried over from CLAUDE.md §15.3's findings and the research
# conversation that produced this file: Wikidata's class hierarchy is
# organic/community-edited, not curated the way DOLCE or a hand-built NER
# type system is -- some entries here are narrow/idiosyncratic (e.g.
# "Tamkang University location" under `location`, "pleading" under `part`),
# and a few descriptions are themselves modeling artifacts rather than
# genuine definitions (e.g. "Tamkang University location": "subclass used
# for 'instance of' (P31) and E426"). Review before relying on this as a
# production seed set; it's a faithful snapshot of the query result, not a
# quality-filtered ontology.

