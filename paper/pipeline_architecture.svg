<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 386 933" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a" /></marker>
    <marker id="arrow-noop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a" /></marker>
    <marker id="arrow-s1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c94f7c" /></marker>
    <marker id="arrow-s2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd6" /></marker>
    <marker id="arrow-s3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d96" /></marker>
    <marker id="arrow-s4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c4fd1" /></marker>
  </defs>
  <rect x="0" y="0" width="386" height="933" fill="#ffffff"/>

  <!-- INPUT -->
  <rect x="66" y="8" width="202" height="70" rx="10" fill="#eef1f5" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="82" y="34" font-size="14.5" font-weight="700" fill="#1b1f24">Input — Text Corpus</text>
  <text x="82" y="56" font-size="12.5" fill="#57606a">unstructured documents</text>

  <line x1="167" y1="78" x2="167" y2="110" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- S1 -->
  <rect x="10.5" y="118" width="313" height="70" rx="10" fill="#fdeef2" stroke="#c94f7c" stroke-width="1.5"/>
  <text x="26.5" y="144" font-size="14.5" font-weight="700" fill="#1b1f24">1 · Initial Typed Triplet Extraction</text>
  <text x="26.5" y="166" font-size="12.5" fill="#57606a">Schema-free LLM extraction</text>

  <line x1="167" y1="188" x2="167" y2="235" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="167" y="218" text-anchor="middle" font-size="12" font-style="italic" fill="#3b4450">raw triplets: G = (s, t_s, r, o, t_o, Q)</text>

  <!-- S2 -->
  <rect x="35" y="243" width="264" height="70" rx="10" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="51" y="269" font-size="14.5" font-weight="700" fill="#1b1f24">2 · Relation Deduplication</text>
  <text x="51" y="291" font-size="12.5" fill="#57606a">Embed, cluster, LLM-verify relations</text>

  <line x1="167" y1="313" x2="167" y2="360" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="167" y="343" text-anchor="middle" font-size="12" font-style="italic" fill="#3b4450">R* — canonical relation vocabulary</text>

  <!-- S3 -->
  <rect x="45.5" y="368" width="243" height="70" rx="10" fill="#e3f6f5" stroke="#1f9d96" stroke-width="1.5"/>
  <text x="61.5" y="394" font-size="14.5" font-weight="700" fill="#1b1f24">3 · Type Canonicalization</text>
  <text x="61.5" y="416" font-size="12.5" fill="#57606a">Embed, cluster, LLM-verify types</text>

  <line x1="167" y1="438" x2="167" y2="485" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="167" y="468" text-anchor="middle" font-size="12" font-style="italic" fill="#3b4450">T* — canonical type vocabulary</text>

  <!-- S4 -->
  <rect x="7.5" y="493" width="319" height="70" rx="10" fill="#f2ecfc" stroke="#7c4fd1" stroke-width="1.5"/>
  <text x="23.5" y="519" font-size="14.5" font-weight="700" fill="#1b1f24">4 · Hierarchy Induction</text>
  <text x="23.5" y="541" font-size="12.5" fill="#57606a">Priority-ordered, LLM-adjudicated placement</text>

  <line x1="167" y1="563" x2="167" y2="610" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="167" y="593" text-anchor="middle" font-size="12" font-style="italic" fill="#3b4450">single-parent type hierarchy</text>

  <!-- S5 -->
  <rect x="26.5" y="618" width="281" height="70" rx="10" fill="#eaf7ea" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="42.5" y="644" font-size="14.5" font-weight="700" fill="#1b1f24">5 · Entity Deduplication</text>
  <text x="42.5" y="666" font-size="12.5" fill="#57606a">Hierarchy-gated, LLM-verified merging</text>

  <line x1="167" y1="688" x2="167" y2="735" stroke="#57606a" stroke-width="1.5" stroke-dasharray="1.5 3" marker-end="url(#arrow-noop)"/>
  <text x="167" y="718" text-anchor="middle" font-size="10" font-style="italic" fill="#57606a">next step -- no data dependency</text>

  <!-- S6 -->
  <rect x="29" y="743" width="276" height="70" rx="10" fill="#fdf1e3" stroke="#d9822b" stroke-width="1.5"/>
  <text x="45" y="769" font-size="14.5" font-weight="700" fill="#1b1f24">6 · Constraints Construction</text>
  <text x="45" y="791" font-size="12.5" fill="#57606a">Direction resolution, LCA, PCA scoring</text>

  <line x1="167" y1="813" x2="167" y2="845" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- OUTPUT -->
  <rect x="6" y="853" width="322" height="70" rx="10" fill="#eef1f5" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="22" y="879" font-size="14.5" font-weight="700" fill="#1b1f24">Output — Typed Knowledge Graph</text>
  <text x="22" y="901" font-size="12.5" fill="#57606a">R*, T*+hierarchy, entities, constraints</text>

  <!-- cross-stage dependencies (see figure caption) -->
  <polyline points="326.5,528 338,528 338,796" fill="none" stroke="#7c4fd1" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="338" y1="796" x2="305" y2="796" stroke="#7c4fd1" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow-s4)"/>
  <polyline points="288.5,403 348,403 348,784" fill="none" stroke="#1f9d96" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="348" y1="663" x2="307.5" y2="663" stroke="#1f9d96" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow-s3)"/>
  <line x1="348" y1="784" x2="305" y2="784" stroke="#1f9d96" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow-s3)"/>
  <polyline points="299,278 358,278 358,772" fill="none" stroke="#3b6fd6" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="358" y1="528" x2="326.5" y2="528" stroke="#3b6fd6" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow-s2)"/>
  <line x1="358" y1="772" x2="305" y2="772" stroke="#3b6fd6" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow-s2)"/>
  <polyline points="323.5,153 368,153 368,760" fill="none" stroke="#c94f7c" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="368" y1="403" x2="288.5" y2="403" stroke="#c94f7c" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow-s1)"/>
  <line x1="368" y1="643" x2="307.5" y2="643" stroke="#c94f7c" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow-s1)"/>
  <line x1="368" y1="760" x2="305" y2="760" stroke="#c94f7c" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow-s1)"/>
</svg>
