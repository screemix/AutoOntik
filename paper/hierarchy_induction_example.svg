<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 625" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="p-arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c4fd1"/></marker>
  </defs>

  <rect x="0" y="0" width="480" height="625" fill="#ffffff"/>

  <!-- Box A: priority queue -->
  <rect x="55" y="14" width="390" height="72" rx="9" fill="#f2ecfc" stroke="#7c4fd1" stroke-width="1.5"/>
  <text x="250" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">Priority queue over T*</text>
  <text x="250" y="55" text-anchor="middle" font-size="12.5" fill="#57606a">types ranked by Weeds-precision in-degree (&#964;); ties</text>
  <text x="250" y="71" text-anchor="middle" font-size="12.5" fill="#57606a">within &#948; share a band -- seeds, if any, pinned at the top</text>

  <!-- arrow A -> B -->
  <line x1="250" y1="86" x2="250" y2="104" stroke="#57606a" stroke-width="1.75" marker-end="url(#p-arrow)"/>
  <text x="264" y="98" font-size="12" font-style="italic" fill="#3b4450">pop highest-priority node</text>

  <!-- Box B: per-node placement -->
  <rect x="55" y="104" width="390" height="64" rx="9" fill="#f2ecfc" stroke="#7c4fd1" stroke-width="1.5"/>
  <text x="250" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">Compare vs. candidates at current level</text>
  <text x="250" y="147" text-anchor="middle" font-size="12.5" fill="#57606a">every current sibling at this level, shown at once</text>
  <text x="250" y="162" text-anchor="middle" font-size="12.5" fill="#57606a">(consolidated first below if the level exceeds B)</text>

  <!-- arrow B -> group -->
  <line x1="250" y1="168" x2="250" y2="182" stroke="#57606a" stroke-width="1.75" marker-end="url(#p-arrow)"/>

  <!-- outcome group container -->
  <rect x="45" y="182" width="410" height="352" rx="10" fill="#fbfbfc" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="200" font-size="12.5" font-weight="700" fill="#1b1f24">LLM decisions -- parent check, then child check</text>

  <!-- row: parent check / synonym -->
  <rect x="60" y="208" width="380" height="58" rx="7" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="1.3"/>
  <text x="70" y="225" font-size="13.5" fill="#1b1f24"><tspan font-weight="700" fill="#3b6fd6">parent check: synonym</tspan> -- merge into the candidate</text>
  <text x="70" y="242" font-size="10.5" font-style="italic" fill="#5a6472">&#8594; next node</text>
  <text x="70" y="257" font-size="10" fill="#6b7685">e.g. <tspan font-weight="700" fill="#3b6fd6">movie</tspan> vs {film} &#8594; merge <tspan font-weight="700" fill="#3b6fd6">movie</tspan> into <tspan font-weight="700" fill="#3b6fd6">film</tspan></text>

  <!-- row: parent check / match -->
  <rect x="60" y="272" width="380" height="58" rx="7" fill="#f6f7f8" stroke="#57606a" stroke-width="1.3"/>
  <text x="70" y="289" font-size="13.5" fill="#1b1f24"><tspan font-weight="700" fill="#3b4450">parent check: match</tspan> -- descend into its children</text>
  <text x="70" y="306" font-size="10.5" font-style="italic" fill="#5a6472">&#8594; recurse: back to "compare" one level deeper</text>
  <text x="70" y="321" font-size="10" fill="#6b7685">e.g. <tspan font-weight="700" fill="#3b4450">documentary film</tspan> vs {audiovisual work} &#8594; descend</text>

  <!-- row: child check / match -->
  <rect x="60" y="336" width="380" height="58" rx="7" fill="#fdeef2" stroke="#c94f7c" stroke-width="1.3"/>
  <text x="70" y="353" font-size="13.5" fill="#1b1f24"><tspan font-weight="700" fill="#c94f7c">child check: match</tspan> -- reparent above it</text>
  <text x="70" y="370" font-size="10.5" font-style="italic" fill="#5a6472">&#8594; corrects an earlier too-shallow attachment; settle, next node</text>
  <text x="70" y="385" font-size="10" fill="#6b7685">e.g. <tspan font-weight="700" fill="#c94f7c">film</tspan> subsumes <tspan font-weight="700" fill="#c94f7c">documentary film</tspan> &#8594; reparent under film</text>

  <!-- row: consolidate (capacity-triggered, not per-pair) -->
  <rect x="60" y="400" width="380" height="58" rx="7" fill="#e3f6f5" stroke="#1f9d96" stroke-width="1.3"/>
  <text x="70" y="417" font-size="13.5" fill="#1b1f24"><tspan font-weight="700" fill="#1f9d96">consolidate</tspan> -- only when level size &gt; B</text>
  <text x="70" y="434" font-size="10.5" font-style="italic" fill="#5a6472">&#8594; groups TRUE siblings under a parent; never a per-pair action</text>
  <text x="70" y="449" font-size="10" fill="#6b7685">e.g. <tspan font-weight="700" fill="#1f9d96">war film</tspan> + <tspan font-weight="700" fill="#1f9d96">action film</tspan> &#8594; group &#8594; <tspan font-weight="700" fill="#1f9d96">genre film</tspan></text>

  <!-- row: none -->
  <rect x="60" y="464" width="380" height="58" rx="7" fill="#eef1f5" stroke="#8a97a8" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="70" y="481" font-size="13.5" fill="#1b1f24"><tspan font-weight="700" fill="#57606a">none</tspan> -- no match in parent or child check</text>
  <text x="70" y="498" font-size="10.5" font-style="italic" fill="#5a6472">&#8594; settle: new root (top level) or child of anchor; next node</text>
  <text x="70" y="513" font-size="10" fill="#6b7685">e.g. <tspan font-weight="700" fill="#57606a">war film</tspan> vs {documentary film} &#8594; settles as sibling</text>

  <!-- arrow group -> C -->
  <line x1="250" y1="534" x2="250" y2="552" stroke="#57606a" stroke-width="1.75" marker-end="url(#p-arrow)"/>

  <!-- Box C: depth bound -->
  <rect x="55" y="552" width="390" height="54" rx="9" fill="#f2ecfc" stroke="#7c4fd1" stroke-width="1.5"/>
  <text x="178" y="573" text-anchor="start" font-size="14" font-weight="700" fill="#1b1f24">Depth bound D<tspan font-size="10" dy="3">max</tspan></text>
  <text x="250" y="591" text-anchor="middle" font-size="11.5" fill="#57606a">exceeds it &#8658; defer into unresolved_children, never forced</text>

  <!-- loop-back: repeat until queue empty -->
  <path d="M55,579 L25,579 L25,50 L55,50" fill="none" stroke="#7c4fd1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#p-arrow-loop)"/>
  <text x="18" y="315" font-size="11.5" font-style="italic" fill="#7c4fd1" text-anchor="middle" transform="rotate(-90 18 315)">repeat until the priority queue is empty</text>
</svg>
