<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1496.9" viewBox="0 0 640 1496.9"><rect x="0" y="0" width="640" height="1496.9" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6474"/></marker><marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D4CE0"/></marker></defs><text x="66" y="36" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#1B1F2B" text-anchor="start">Hierarchy placement, per focal type</text><text x="66" y="58" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#5B6474" text-anchor="start">Highest-priority type first; every merge, reparent, and consolidation decision</text><text x="66" y="74" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#5B6474" text-anchor="start">below is a dedicated LLM call.</text><rect x="66" y="102" width="548" height="66" rx="10" fill="#F2EEFC" stroke="#6D4CE0" stroke-width="1.6"/><text x="340.0" y="126" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#1B1F2B" text-anchor="middle">Priority queue over T*</text><text x="340.0" y="145" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" fill="#5B6474" text-anchor="middle">types ranked by Weeds-precision in-degree (τ); ties within δ share</text><text x="340.0" y="161" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" fill="#5B6474" text-anchor="middle">a band — seeds, if any, pinned at the top</text><line x1="340.0" y1="168" x2="340.0" y2="190" stroke="#5B6474" stroke-width="1.8" marker-end="url(#arrow)"/><text x="354.0" y="183.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#5B6474" text-anchor="start">pop highest-priority node</text><rect x="66" y="190" width="548" height="58" rx="10" fill="#F5F6FA" stroke="#9099AA" stroke-width="1.6"/><text x="340.0" y="214" font-family="DejaVu Sans" font-size="15.5" font-weight="bold" fill="#1B1F2B" text-anchor="middle">Current level's candidates</text><text x="340.0" y="233" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" fill="#5B6474" text-anchor="middle">siblings under this anchor (or the live root set)</text><line x1="340.0" y1="248" x2="340.0" y2="268" stroke="#5B6474" stroke-width="1.8" marker-end="url(#arrow)"/><text x="340.0" y="281" font-family="DejaVu Sans" font-size="12.6" font-weight="bold" fill="#1B1F2B" text-anchor="middle">level size &gt; B (candidate batch size)?</text><line x1="82" y1="292" x2="82" y2="310" stroke="#0E8C7F" stroke-width="1.8" marker-end="url(#arrow)"/><text x="92" y="305" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#0E8C7F" text-anchor="start">yes</text><rect x="66" y="310" width="548" height="166.18" rx="10" fill="#E7F5F3" stroke="#0E8C7F" stroke-width="1.6"/><text x="78" y="332.88"><tspan fill="#0E8C7F" font-family="DejaVu Sans" font-size="13.6" font-weight="bold">CONSOLIDATE</tspan><tspan fill="#5B6474" font-family="DejaVu Sans" font-size="13.6" font-weight="normal">  — fires BETWEEN types, never on one pair</tspan></text><text x="78" y="352.88" font-family="DejaVu Sans" font-size="12.4" font-weight="normal" fill="#5B6474" text-anchor="start">LLM groups the TRUE siblings in this level under a synthesized (or</text><text x="78" y="368.88" font-family="DejaVu Sans" font-size="12.4" font-weight="normal" fill="#5B6474" text-anchor="start">reused) shared parent; everything else is left out.</text><rect x="78" y="390.88" width="524" height="49.3" rx="6" fill="#F7F7FA" stroke="#E4E7EE" stroke-width="1"/><text x="88" y="410.71999999999997" font-family="DejaVu Sans Mono" font-size="12.3"><tspan fill="#5B6474" font-weight="normal">film's children: </tspan><tspan fill="#1B1F2B" font-weight="bold">{documentary film, war film, action film}</tspan></text><text x="88" y="427.71999999999997" font-family="DejaVu Sans Mono" font-size="12.3"><tspan fill="#1B1F2B" font-weight="bold">3 </tspan><tspan fill="#5B6474" font-weight="normal">&gt; B(=2) </tspan><tspan fill="#5B6474" font-weight="normal">→ group </tspan><tspan fill="#0E8C7F" font-weight="bold">war film + action film</tspan><tspan fill="#5B6474" font-weight="normal"> → </tspan><tspan fill="#0E8C7F" font-weight="bold">genre film</tspan></text><text x="78" y="458.18" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" fill="#5B6474" text-anchor="start">→ level is now ≤ B; the focal type's own checks below run against the consolidated level</text><text x="604" y="296" font-family="DejaVu Sans" font-size="11.6" font-weight="normal" fill="#9AA3B2" text-anchor="end">no / now ≤ B → continue</text><line x1="340.0" y1="486.18" x2="340.0" y2="506.18" stroke="#5B6474" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="66" y="506.18" width="548" height="40" rx="10" fill="#EEF0FC" stroke="#4C5FD5" stroke-width="1.6"/><text x="340.0" y="531.1800000000001" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#1B1F2B" text-anchor="middle">PARENT CHECK — does focal belong under ANY ONE candidate?</text><rect x="66" y="556.1800000000001" width="548" height="166.17999999999995" rx="10" fill="#ECF2FD" stroke="#2E6FE0" stroke-width="1.6"/><text x="78" y="579.0600000000001"><tspan fill="#2E6FE0" font-family="DejaVu Sans" font-size="13.6" font-weight="bold">match, same_concept = true</tspan><tspan fill="#5B6474" font-family="DejaVu Sans" font-size="13.6" font-weight="normal">  →  </tspan><tspan fill="#2E6FE0" font-family="DejaVu Sans" font-size="13.6" font-weight="bold">MERGE</tspan></text><text x="78" y="599.0600000000001" font-family="DejaVu Sans" font-size="12.4" font-weight="normal" fill="#5B6474" text-anchor="start">focal and the matched candidate are the identical concept, just worded</text><text x="78" y="615.0600000000001" font-family="DejaVu Sans" font-size="12.4" font-weight="normal" fill="#5B6474" text-anchor="start">differently.</text><rect x="78" y="637.0600000000001" width="524" height="49.3" rx="6" fill="#F7F7FA" stroke="#E4E7EE" stroke-width="1"/><text x="88" y="656.9000000000001" font-family="DejaVu Sans Mono" font-size="12.3"><tspan fill="#1B1F2B" font-weight="bold">movie</tspan><tspan fill="#5B6474" font-weight="normal"> vs {film} → same_concept=true</tspan></text><text x="88" y="673.9000000000001" font-family="DejaVu Sans Mono" font-size="12.3"><tspan fill="#5B6474" font-weight="normal">→ merge </tspan><tspan fill="#2E6FE0" font-weight="bold">movie</tspan><tspan fill="#5B6474" font-weight="normal"> into </tspan><tspan fill="#2E6FE0" font-weight="bold">film</tspan></text><text x="78" y="704.36" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" fill="#5B6474" text-anchor="start">→ next node</text><rect x="66" y="732.36" width="548" height="166.17999999999995" rx="10" fill="#EEF0FC" stroke="#4C5FD5" stroke-width="1.6"/><text x="78" y="755.24"><tspan fill="#4C5FD5" font-family="DejaVu Sans" font-size="13.6" font-weight="bold">match, not same concept</tspan><tspan fill="#5B6474" font-family="DejaVu Sans" font-size="13.6" font-weight="normal">  →  </tspan><tspan fill="#4C5FD5" font-family="DejaVu Sans" font-size="13.6" font-weight="bold">DESCEND</tspan></text><text x="78" y="775.24" font-family="DejaVu Sans" font-size="12.4" font-weight="normal" fill="#5B6474" text-anchor="start">focal IS-A the matched candidate; recurse into that candidate's own</text><text x="78" y="791.24" font-family="DejaVu Sans" font-size="12.4" font-weight="normal" fill="#5B6474" text-anchor="start">children.</text><rect x="78" y="813.24" width="524" height="49.3" rx="6" fill="#F7F7FA" stroke="#E4E7EE" stroke-width="1"/><text x="88" y="833.08" font-family="DejaVu Sans Mono" font-size="12.3"><tspan fill="#1B1F2B" font-weight="bold">documentary film</tspan><tspan fill="#5B6474" font-weight="normal"> vs {audiovisual work} → match</tspan></text><text x="88" y="850.08" font-family="DejaVu Sans Mono" font-size="12.3"><tspan fill="#5B6474" font-weight="normal">→ descend into </tspan><tspan fill="#4C5FD5" font-weight="bold">audiovisual work</tspan><tspan fill="#5B6474" font-weight="normal">'s children</tspan></text><text x="78" y="880.54" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" fill="#5B6474" text-anchor="start">→ recurse: back to the level/capacity check, one level deeper</text><text x="70" y="922.54" font-family="DejaVu Sans" font-size="12.6" font-weight="bold" fill="#5B6474" text-anchor="start">no match on EITHER candidate</text><text x="70" y="938.54" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" fill="#9AA3B2" text-anchor="start">→ proceed to CHILD CHECK below</text><line x1="340.0" y1="952.54" x2="340.0" y2="972.54" stroke="#D6336C" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="66" y="972.54" width="548" height="54" rx="10" fill="#FBEFF2" stroke="#D6336C" stroke-width="1.6"/><text x="340.0" y="995.54" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#1B1F2B" text-anchor="middle">CHILD CHECK — does focal subsume ONE OR MORE candidates?</text><text x="340.0" y="1013.54" font-family="DejaVu Sans" font-size="11.8" font-weight="normal" fill="#5B6474" text-anchor="middle">only asked if PARENT CHECK matched nothing</text><rect x="66" y="1036.54" width="548" height="166.18000000000006" rx="10" fill="#FBEFF2" stroke="#D6336C" stroke-width="1.6"/><text x="78" y="1059.42"><tspan fill="#D6336C" font-family="DejaVu Sans" font-size="13.6" font-weight="bold">match (one or more)</tspan><tspan fill="#5B6474" font-family="DejaVu Sans" font-size="13.6" font-weight="normal">  →  </tspan><tspan fill="#D6336C" font-family="DejaVu Sans" font-size="13.6" font-weight="bold">REPARENT</tspan></text><text x="78" y="1079.42" font-family="DejaVu Sans" font-size="12.4" font-weight="normal" fill="#5B6474" text-anchor="start">insert focal above the matched candidate(s); corrects an earlier</text><text x="78" y="1095.42" font-family="DejaVu Sans" font-size="12.4" font-weight="normal" fill="#5B6474" text-anchor="start">too-shallow attachment.</text><rect x="78" y="1117.42" width="524" height="49.3" rx="6" fill="#F7F7FA" stroke="#E4E7EE" stroke-width="1"/><text x="88" y="1137.26" font-family="DejaVu Sans Mono" font-size="12.3"><tspan fill="#1B1F2B" font-weight="bold">film</tspan><tspan fill="#5B6474" font-weight="normal"> subsumes </tspan><tspan fill="#1B1F2B" font-weight="bold">documentary film</tspan></text><text x="88" y="1154.26" font-family="DejaVu Sans Mono" font-size="12.3"><tspan fill="#5B6474" font-weight="normal">→ reparent </tspan><tspan fill="#D6336C" font-weight="bold">documentary film</tspan><tspan fill="#5B6474" font-weight="normal">: audiovisual work </tspan><tspan fill="#D6336C" font-weight="bold">→</tspan><tspan fill="#5B6474" font-weight="normal"> film</tspan></text><text x="78" y="1184.72" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" fill="#5B6474" text-anchor="start">→ focal settles at this level; next node</text><rect x="66" y="1212.72" width="548" height="150.18000000000006" rx="10" fill="#F5F6FA" stroke="#9099AA" stroke-width="1.6"/><text x="78" y="1235.6000000000001"><tspan fill="#9099AA" font-family="DejaVu Sans" font-size="13.6" font-weight="bold">no match either</tspan><tspan fill="#5B6474" font-family="DejaVu Sans" font-size="13.6" font-weight="normal">  →  </tspan><tspan fill="#9099AA" font-family="DejaVu Sans" font-size="13.6" font-weight="bold">NONE</tspan></text><text x="78" y="1255.6000000000001" font-family="DejaVu Sans" font-size="12.4" font-weight="normal" fill="#5B6474" text-anchor="start">neither check found anything; focal settles right here.</text><rect x="78" y="1277.6000000000001" width="524" height="49.3" rx="6" fill="#F7F7FA" stroke="#E4E7EE" stroke-width="1"/><text x="88" y="1297.44" font-family="DejaVu Sans Mono" font-size="12.3"><tspan fill="#1B1F2B" font-weight="bold">war film</tspan><tspan fill="#5B6474" font-weight="normal"> vs {documentary film} → no match in either check</tspan></text><text x="88" y="1314.44" font-family="DejaVu Sans Mono" font-size="12.3"><tspan fill="#5B6474" font-weight="normal">→ settle as a plain sibling under </tspan><tspan fill="#1B1F2B" font-weight="bold">film</tspan></text><text x="78" y="1344.9" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" fill="#5B6474" text-anchor="start">→ new root (top level) or plain child of the current anchor; next node</text><line x1="340.0" y1="1376.9" x2="340.0" y2="1396.9" stroke="#5B6474" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="66" y="1396.9" width="548" height="54" rx="10" fill="#F2EEFC" stroke="#6D4CE0" stroke-width="1.6"/><text x="340.0" y="1419.9" font-family="DejaVu Sans" font-size="15.5" font-weight="bold" fill="#1B1F2B" text-anchor="middle">Depth bound D</text><text x="340.0" y="1437.9" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" fill="#5B6474" text-anchor="middle">exceeds it ⇒ defer into unresolved_children, never forced or discarded</text><text x="400.0" y="1423.9" font-family="DejaVu Sans" font-size="10.5" font-weight="normal" fill="#1B1F2B" text-anchor="start">max</text><path d="M 46.0 1476.9 L 46.0 135.0 L 66 135.0" fill="none" stroke="#6D4CE0" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-loop)"/><line x1="66" y1="1476.9" x2="46.0" y2="1476.9" stroke="#6D4CE0" stroke-width="1.8" stroke-dasharray="6,4"/><text x="36.0" y="805.95" transform="rotate(-90 36.0 805.95)" font-family="DejaVu Sans" font-size="11.6" font-weight="normal" fill="#6D4CE0" text-anchor="middle">repeat until the priority queue is empty</text></svg>