<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 545" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="p-arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c4fd1"/></marker>
  </defs>

  <rect x="0" y="0" width="480" height="545" fill="#ffffff"/>

  <!-- Box A: priority queue -->
  <rect x="55" y="14" width="390" height="72" rx="9" fill="#f2ecfc" stroke="#7c4fd1" stroke-width="1.5"/>
  <text x="250" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">Priority queue over T*</text>
  <text x="250" y="55" text-anchor="middle" font-size="12.5" fill="#57606a">types ranked by Weeds-precision in-degree (&#964;); ties</text>
  <text x="250" y="71" text-anchor="middle" font-size="12.5" fill="#57606a">within &#948; share a band -- seeds, if any, pinned at the top</text>

  <!-- arrow A -> B -->
  <line x1="250" y1="86" x2="250" y2="104" stroke="#57606a" stroke-width="1.75" marker-end="url(#p-arrow)"/>
  <text x="264" y="98" font-size="12" font-style="italic" fill="#3b4450">pop highest-priority node</text>

  <!-- Box B: per-node placement -->
  <rect x="55" y="104" width="390" height="64" rx="9" fill="#f2ecfc" stroke="#7c4fd1" stroke-width="1.5"/>
  <text x="250" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">Compare vs. candidates at current level</text>
  <text x="250" y="147" text-anchor="middle" font-size="12.5" fill="#57606a">similarity-ranked batches of size B; escalate up to E</text>
  <text x="250" y="162" text-anchor="middle" font-size="12.5" fill="#57606a">times whenever a batch returns "none"</text>

  <!-- arrow B -> group -->
  <line x1="250" y1="168" x2="250" y2="182" stroke="#57606a" stroke-width="1.75" marker-end="url(#p-arrow)"/>

  <!-- outcome group container -->
  <rect x="45" y="182" width="410" height="272" rx="10" fill="#fbfbfc" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="200" font-size="12.5" font-weight="700" fill="#1b1f24">LLM decision -- one of five outcomes</text>

  <!-- row: synonym -->
  <rect x="60" y="208" width="380" height="42" rx="7" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="1.3"/>
  <text x="70" y="225" font-size="13.5" fill="#1b1f24"><tspan font-weight="700" fill="#3b6fd6">synonym</tspan> -- merge into the matched candidate</text>
  <text x="70" y="242" font-size="10.5" font-style="italic" fill="#5a6472">&#8594; next node</text>

  <!-- row: child of -->
  <rect x="60" y="256" width="380" height="42" rx="7" fill="#f6f7f8" stroke="#57606a" stroke-width="1.3"/>
  <text x="70" y="273" font-size="13.5" fill="#1b1f24"><tspan font-weight="700" fill="#3b4450">child of</tspan> -- descend into that candidate's own children</text>
  <text x="70" y="290" font-size="10.5" font-style="italic" fill="#5a6472">&#8594; recurse: back to "compare" one level deeper</text>

  <!-- row: parent of -->
  <rect x="60" y="304" width="380" height="42" rx="7" fill="#fdeef2" stroke="#c94f7c" stroke-width="1.3"/>
  <text x="70" y="321" font-size="13.5" fill="#1b1f24"><tspan font-weight="700" fill="#c94f7c">parent of</tspan> -- insert above; retroactively reparent it</text>
  <text x="70" y="338" font-size="10.5" font-style="italic" fill="#5a6472">&#8594; corrects an earlier too-shallow attachment; settle, next node</text>

  <!-- row: same class -->
  <rect x="60" y="352" width="380" height="42" rx="7" fill="#e3f6f5" stroke="#1f9d96" stroke-width="1.3"/>
  <text x="70" y="369" font-size="13.5" fill="#1b1f24"><tspan font-weight="700" fill="#1f9d96">same class</tspan> -- synthesize a new shared parent</text>
  <text x="70" y="386" font-size="10.5" font-style="italic" fill="#5a6472">&#8594; new node re-enters the priority queue</text>

  <!-- row: none -->
  <rect x="60" y="400" width="380" height="42" rx="7" fill="#eef1f5" stroke="#8a97a8" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="70" y="417" font-size="13.5" fill="#1b1f24"><tspan font-weight="700" fill="#57606a">none</tspan> -- no candidate matches, even at the last batch</text>
  <text x="70" y="434" font-size="10.5" font-style="italic" fill="#5a6472">&#8594; settle: new root (top level) or child of anchor; next node</text>

  <!-- arrow group -> C -->
  <line x1="250" y1="454" x2="250" y2="472" stroke="#57606a" stroke-width="1.75" marker-end="url(#p-arrow)"/>

  <!-- Box C: depth bound -->
  <rect x="55" y="472" width="390" height="54" rx="9" fill="#f2ecfc" stroke="#7c4fd1" stroke-width="1.5"/>
  <text x="250" y="493" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">Depth bound D<tspan font-size="10" baseline-shift="-4">max</tspan></text>
  <text x="250" y="511" text-anchor="middle" font-size="11.5" fill="#57606a">exceeds it &#8658; defer into unresolved_children, never forced</text>

  <!-- loop-back: repeat until queue empty -->
  <path d="M55,499 L25,499 L25,50 L55,50" fill="none" stroke="#7c4fd1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#p-arrow-loop)"/>
  <text x="18" y="275" font-size="11.5" font-style="italic" fill="#7c4fd1" text-anchor="middle" transform="rotate(-90 18 275)">repeat until the priority queue is empty</text>
</svg>
